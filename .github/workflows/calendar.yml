name: Drop calendar

# T44 (CEO C4): one drop opens every date. This fails when the published catalog has fewer than 7 days of drops
# scheduled ahead, so a missed batch shows up before players see a day without one. It passes while no picture is dated.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Days of drops scheduled
        run: ./gradlew :shared:checkDropCalendar
